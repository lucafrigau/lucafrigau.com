# Build the site with Quarto, test it and, on request, publish it on GitHub
# Pages.
#
# - Every push to `main` and every pull request runs the tests, builds the
#   site and checks its internal links. Nothing is published.
# - Publishing is manual: Actions > "Build and publish" > "Run workflow" on
#   the `main` branch, after the changes have been reviewed and approved.
#   It needs GitHub Pages enabled in the repository settings with
#   "Source: GitHub Actions" (see README.md, "Publish").

name: Build and publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          # Same version used to develop and test the site; update deliberately.
          version: 1.9.37

      - name: Install the test dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet pyyaml==6.0.2

      - name: Run the tests
        run: '"$RUNNER_TEMP/venv/bin/python" tests/run_tests.py'

      - name: Render the site
        run: quarto render

      - name: Check internal links
        run: python3 scripts/check_links.py _site

      - name: Upload the site
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    # Only a manual run on `main` publishes.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
