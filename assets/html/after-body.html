<script>
  // Small fixes to the markup generated by Quarto:
  // - "include-before-body" content is placed inside <main>, so the skip link
  //   is moved to the start of <body>, before the navigation bar;
  // - the menu button is a plain toggle button, not an ARIA menu;
  // - the theme switch is announced as a button with its on/off state;
  // - the two navigation landmarks (menu, contents of the page) get names;
  // - pages in research/ highlight "Research" in the navigation bar.
  (function () {
    var link = document.querySelector(".skip-link");
    if (link) document.body.insertBefore(link, document.body.firstChild);
    var toggler = document.querySelector(".navbar-toggler");
    if (toggler) toggler.removeAttribute("role");
    document.querySelectorAll(".quarto-color-scheme-toggle").forEach(function (sw) {
      var update = function () {
        sw.setAttribute("aria-pressed", document.body.classList.contains("quarto-dark") ? "true" : "false");
      };
      sw.setAttribute("role", "button");
      sw.setAttribute("aria-label", "Dark theme");
      sw.setAttribute("title", "Dark theme");
      update();
      sw.addEventListener("click", function () { setTimeout(update, 0); });
      // A link works with Enter only; a button also works with the space bar.
      sw.addEventListener("keydown", function (e) {
        if (e.key === " ") { e.preventDefault(); sw.click(); }
      });
    });
    var menu = document.querySelector("#quarto-header nav.navbar");
    if (menu) menu.setAttribute("aria-label", "Main");
    var toc = document.querySelector("nav#TOC");
    if (toc && document.getElementById("toc-title")) toc.setAttribute("aria-labelledby", "toc-title");
    if (/\/research\/[^\/]+$/.test(window.location.pathname)) {
      document.querySelectorAll(".navbar-nav .nav-link").forEach(function (a) {
        if (/research\.html$/.test(a.getAttribute("href") || "")) a.classList.add("active");
      });
    }
  })();
</script>
