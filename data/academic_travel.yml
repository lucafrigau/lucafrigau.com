# Visiting positions and conference presentations: the map, its tooltips and
# the list in the "International academic activities" section of the About
# page. After editing this file, run
#     python3 scripts/travel_map.py
# which rewrites _travel-map.md (the tests check that it is up to date).
#
# Only activities listed in the CV and held in person:
#   visit  visiting positions;
#   talk   presentations given at a conference, including talks in invited
#          sessions (the CV's "Conference presentations").
# Not included: online events, proceedings without a talk, committees and the
# organization of sessions.
#
# Fields
#   type           visit or talk
#   name           institution (visit) or conference, as shown on the site
#   role           visits only: the position held, as in the CV
#   unit, host, topic   visits only: department, who invited, research topic
#                  (shown as "invited by <host> to collaborate on <topic>")
#   event          talks only: full name of the conference, as in the CV
#   title          talks only: title of the presentation, as in the CV; leave
#                  it out if it is not documented
#   invited        talks only: true for a talk in an invited session, as
#                  marked in the CV
#   city, country  in English; places with the same city share one marker
#   year, dates    as in the CV
#   lat, lon       position of the city, two decimals (OpenStreetMap, found
#                  with Nominatim in October 2026; see README)
#   source         where the entry was checked

